<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a371f7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <title>Sparkles</title>
  <style>
    .sparkle { transform-origin: 12px 12px; animation: twinkle 3.6s ease-in-out infinite; }
